<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>ASCII Shader — by creative_bones</title>

<style>

html,
body {

    margin: 0;
    background: black;
    overflow: hidden;
    font-family: monospace;

}

canvas {

    width: 100vw;
    height: 100vh;
    display: block;
    image-rendering: pixelated;

}

#ui {

    position: fixed;

    top: 20px;
    left: 20px;

    z-index: 100;

    width: 320px;

    max-height: calc(100vh - 40px);
    overflow-y: auto;

    background: rgba(0,0,0,.92);

    border: 1px solid #333;

    border-radius: 14px;

    padding: 16px;

    display: flex;
    flex-direction: column;
    gap: 12px;

    color: white;

}

.header {

    display: flex;
    flex-direction: column;
    gap: 2px;

    padding-bottom: 10px;

    border-bottom: 1px solid #222;

}

.title {

    font-size: 14px;
    font-weight: 700;
    letter-spacing: 4px;

}

.subtitle {

    font-size: 10px;
    opacity: .45;
    letter-spacing: 2px;

}

input,
button,
select {

    width: 100%;

    background: #111;
    color: white;

    border: 1px solid #444;

    border-radius: 8px;

    padding: 10px;

    box-sizing: border-box;

    font-family: monospace;

}

input[type="range"] {

    padding: 0;
    border: none;
    background: transparent;
    height: 4px;

    -webkit-appearance: none;
    appearance: none;

    margin: 6px 0 0 0;

}

input[type="range"]::-webkit-slider-runnable-track {
    height: 4px;
    background: #222;
    border-radius: 2px;
}

input[type="range"]::-moz-range-track {
    height: 4px;
    background: #222;
    border-radius: 2px;
}

input[type="range"]::-webkit-slider-thumb {

    -webkit-appearance: none;
    appearance: none;

    width: 14px;
    height: 14px;

    background: white;

    border-radius: 50%;

    margin-top: -5px;

    cursor: pointer;
}

input[type="range"]::-moz-range-thumb {

    width: 14px;
    height: 14px;

    background: white;

    border-radius: 50%;
    border: none;

    cursor: pointer;
}

input[type="color"] {

    height: 36px;
    padding: 2px;

    cursor: pointer;

}

button {
    cursor: pointer;
}

button:hover {
    background: #222;
}

.label-row {

    display: flex;
    justify-content: space-between;
    align-items: baseline;

}

label {

    font-size: 12px;
    opacity: .7;

}

.value {

    font-size: 12px;
    opacity: .9;
    font-variant-numeric: tabular-nums;

}

.slider-wrap {

    position: relative;

}

.history-track {

    position: relative;

    height: 8px;

    margin-top: 4px;

}

.history-track .marker {

    position: absolute;

    top: 0;

    width: 1px;
    height: 6px;

    background: white;

    transform: translateX(-50%);

}

.color-row {

    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;

}

.color-row > div {

    display: flex;
    flex-direction: column;
    gap: 4px;

}

.swap-btn {

    width: auto;

    padding: 6px 10px;

    font-size: 11px;

    opacity: .8;

}

.status {

    font-size: 12px;
    opacity: .7;

}

.footer {

    border-top: 1px solid #222;

    padding-top: 10px;

    font-size: 11px;
    opacity: .55;

    display: flex;
    justify-content: space-between;
    align-items: center;

}

.footer a {

    color: white;
    text-decoration: none;

    opacity: .8;

    transition: opacity .15s;

}

.footer a:hover {

    opacity: 1;
    text-decoration: underline;

}

</style>
</head>
<body>

<div id="ui">

    <div class="header">
        <div class="title">
            ASCII SHADER
        </div>
        <div class="subtitle">
            video → glyph converter
        </div>
    </div>

    <input
        type="file"
        id="videoUpload"
        accept="video/*"
    >

    <div>

        <label>
            ASCII Symbols
        </label>

        <input
            type="text"
            id="chars"
            value=" .:-=+*#%@"
        >

    </div>

    <div>

        <div class="label-row">

            <label>
                Cell Size
            </label>

            <span
                class="value"
                id="cellSizeValue"
            >
                8
            </span>

        </div>

        <div class="slider-wrap">

            <input
                type="range"
                id="cellSize"
                min="4"
                max="24"
                value="8"
            >

            <div
                class="history-track"
                id="cellSizeHistory"
            ></div>

        </div>

    </div>

    <div>

        <div class="label-row">

            <label>
                Contrast
            </label>

            <span
                class="value"
                id="contrastValue"
            >
                2.0
            </span>

        </div>

        <div class="slider-wrap">

            <input
                type="range"
                id="contrast"
                min="1"
                max="5"
                step="0.1"
                value="2"
            >

            <div
                class="history-track"
                id="contrastHistory"
            ></div>

        </div>

    </div>

    <div>

        <label>
            Render Mode
        </label>

        <select id="mode">

            <option value="bw">
                Monochrome
            </option>

            <option value="tinted">
                Tinted (uses glyph color)
            </option>

            <option value="color">
                Source Color
            </option>

        </select>

    </div>

    <div>

        <label>
            Palette
        </label>

        <div class="color-row">

            <div>
                <label>Background</label>
                <input
                    type="color"
                    id="bgColor"
                    value="#000000"
                >
            </div>

            <div>
                <label>Glyphs</label>
                <input
                    type="color"
                    id="fgColor"
                    value="#ffffff"
                >
            </div>

        </div>

        <button
            id="swapColors"
            class="swap-btn"
            style="margin-top:6px"
        >
            ⇄ swap colors
        </button>

    </div>

    <button id="exportBtn">
        Export MP4
    </button>

    <div
        class="status"
        id="status"
    >
        loading sample...
    </div>

    <div class="footer">
        <span>by creative_bones</span>
        <a
            href="https://t.me/creative_bones"
            target="_blank"
            rel="noopener"
        >
            t.me/creative_bones
        </a>
    </div>

</div>

<video
    id="video"
    style="display:none"
    loop
    muted
    playsinline
></video>

<canvas id="canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/build/mp4-muxer.min.js"></script>

<script>

const canvas =
    document.getElementById('canvas');

const ctx =
    canvas.getContext('2d');

const video =
    document.getElementById('video');

const upload =
    document.getElementById('videoUpload');

const charsInput =
    document.getElementById('chars');

const cellSlider =
    document.getElementById('cellSize');

const contrastSlider =
    document.getElementById('contrast');

const cellValueEl =
    document.getElementById('cellSizeValue');

const contrastValueEl =
    document.getElementById('contrastValue');

const cellHistoryEl =
    document.getElementById('cellSizeHistory');

const contrastHistoryEl =
    document.getElementById('contrastHistory');

const modeSelect =
    document.getElementById('mode');

const bgColorEl =
    document.getElementById('bgColor');

const fgColorEl =
    document.getElementById('fgColor');

const swapColorsBtn =
    document.getElementById('swapColors');

const exportBtn =
    document.getElementById('exportBtn');

const statusText =
    document.getElementById('status');

canvas.width = 1920;
canvas.height = 1080;

let animationId;

function brightness(r,g,b){

    return (
        0.299 * r +
        0.587 * g +
        0.114 * b
    ) / 255;

}

function hexToRgb(hex){

    const v = hex.replace('#','');
    return [
        parseInt(v.substring(0,2), 16),
        parseInt(v.substring(2,4), 16),
        parseInt(v.substring(4,6), 16),
    ];
}

/* ──────────────── Slider value display + memory markers ──────────────── */

function setupSlider(
    slider,
    valueEl,
    historyEl,
    formatter
){

    const history = [];

    const min = parseFloat(slider.min);
    const max = parseFloat(slider.max);

    function updateValueLabel(){
        valueEl.textContent =
            formatter(slider.value);
    }

    function renderHistory(){

        historyEl.innerHTML = '';

        history.forEach((v, idx) => {

            const m =
                document.createElement('div');

            m.className = 'marker';

            const pct =
                (
                    (parseFloat(v) - min) /
                    (max - min)
                ) * 100;

            m.style.left = pct + '%';

            const age =
                history.length - idx;

            m.style.opacity =
                Math.max(
                    0.15,
                    1 - (age - 1) * 0.18
                );

            historyEl.appendChild(m);

        });
    }

    function pushHistory(){

        const v = slider.value;

        if(
            history.length &&
            history[history.length - 1] === v
        ) return;

        history.push(v);

        if(history.length > 6){
            history.shift();
        }

        renderHistory();

    }

    slider.addEventListener(
        'input',
        updateValueLabel
    );

    slider.addEventListener(
        'change',
        pushHistory
    );

    updateValueLabel();
    pushHistory();

}

setupSlider(
    cellSlider,
    cellValueEl,
    cellHistoryEl,
    v => String(parseInt(v)) + 'px'
);

setupSlider(
    contrastSlider,
    contrastValueEl,
    contrastHistoryEl,
    v => parseFloat(v).toFixed(1)
);

/* ──────────────── Color swap ──────────────── */

swapColorsBtn.addEventListener(
    'click',
    () => {

        const a = bgColorEl.value;
        bgColorEl.value = fgColorEl.value;
        fgColorEl.value = a;

    }
);

/* ──────────────── Video source handling ──────────────── */

function loadVideoFromUrl(url, isLocal){

    if(isLocal){
        video.removeAttribute('crossorigin');
    } else {
        video.setAttribute(
            'crossorigin',
            'anonymous'
        );
    }

    video.src = url;

    video.onloadeddata = () => {

        statusText.innerText = 'playing';

        video.play().catch(()=>{
            statusText.innerText =
                'click canvas to play';
        });

        cancelAnimationFrame(animationId);
        render();

    };

    video.onerror = () => {
        statusText.innerText =
            'failed to load video';
    };

}

upload.addEventListener(
    'change',
    e => {

        const file =
            e.target.files[0];

        if(!file) return;

        loadVideoFromUrl(
            URL.createObjectURL(file),
            true
        );
    }
);

// Local sample sitting next to index.html.
loadVideoFromUrl('./sample.mp4', true);

canvas.addEventListener(
    'click',
    () => {
        if(video.src){
            video.play();
        }
    }
);

/* ──────────────── ASCII rendering ──────────────── */

function renderASCII(){

    const cellSize =
        parseInt(cellSlider.value);

    const contrast =
        parseFloat(
            contrastSlider.value
        );

    const chars =
        charsInput.value || ' .:-=+*#%@';

    const mode = modeSelect.value;

    const [bgR, bgG, bgB] =
        hexToRgb(bgColorEl.value);

    const [fgR, fgG, fgB] =
        hexToRgb(fgColorEl.value);

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    const frame =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

    const data =
        frame.data;

    ctx.fillStyle = bgColorEl.value;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.font =
        `${cellSize}px monospace`;

    ctx.textBaseline = "top";

    for(
        let y = 0;
        y < canvas.height;
        y += cellSize
    ){

        for(
            let x = 0;
            x < canvas.width;
            x += cellSize
        ){

            const i =
                (
                    y *
                    canvas.width +
                    x
                ) * 4;

            const r = data[i];
            const g = data[i+1];
            const b = data[i+2];

            let lum =
                brightness(r,g,b);

            lum =
                Math.pow(
                    lum,
                    contrast
                );

            const index =
                Math.floor(
                    lum *
                    (chars.length - 1)
                );

            const char = chars[index];

            if(mode === 'bw'){

                // Glyph color mixes from BG → FG by luminance
                const rr =
                    Math.round(
                        bgR + (fgR - bgR) * lum
                    );
                const gg =
                    Math.round(
                        bgG + (fgG - bgG) * lum
                    );
                const bb =
                    Math.round(
                        bgB + (fgB - bgB) * lum
                    );

                ctx.fillStyle =
                    `rgb(${rr},${gg},${bb})`;

            } else if(mode === 'tinted'){

                // Full FG color, dimmed by luminance
                const rr =
                    Math.round(fgR * lum);
                const gg =
                    Math.round(fgG * lum);
                const bb =
                    Math.round(fgB * lum);

                ctx.fillStyle =
                    `rgb(${rr},${gg},${bb})`;

            } else {

                // Source color from video pixel
                ctx.fillStyle =
                    `rgb(${r},${g},${b})`;

            }

            ctx.fillText(char, x, y);

        }
    }
}

function render(){

    if(!video.paused){
        renderASCII();
    }

    animationId =
        requestAnimationFrame(render);
}

function seekVideo(t){

    return new Promise(resolve => {

        const onSeeked = () => {
            video.removeEventListener(
                'seeked',
                onSeeked
            );
            resolve();
        };

        video.addEventListener(
            'seeked',
            onSeeked
        );

        video.currentTime = t;

    });
}

/* ──────────────── MP4 export ──────────────── */

exportBtn.onclick =
async () => {

    if(!video.src) return;

    cancelAnimationFrame(animationId);

    video.pause();

    const width = canvas.width;
    const height = canvas.height;
    const fps = 30;

    if(
        typeof VideoEncoder === 'undefined' ||
        typeof Mp4Muxer === 'undefined'
    ){
        statusText.innerText =
            'MP4 export not supported in this browser';
        render();
        return;
    }

    statusText.innerText = 'preparing...';

    const codec = 'avc1.640028';

    let supported = false;
    try {
        const check =
            await VideoEncoder.isConfigSupported({
                codec,
                width,
                height,
                bitrate: 12_000_000,
                framerate: fps,
            });
        supported = !!(check && check.supported);
    } catch(e) {
        supported = false;
    }

    if(!supported){
        statusText.innerText =
            'H.264 encoder not available';
        render();
        return;
    }

    const muxer =
        new Mp4Muxer.Muxer({
            target:
                new Mp4Muxer.ArrayBufferTarget(),
            video: {
                codec: 'avc',
                width,
                height,
                frameRate: fps,
            },
            fastStart: 'in-memory',
        });

    const encoder =
        new VideoEncoder({
            output: (chunk, meta) =>
                muxer.addVideoChunk(chunk, meta),
            error: e => console.error(e),
        });

    encoder.configure({
        codec,
        width,
        height,
        bitrate: 12_000_000,
        framerate: fps,
    });

    const duration = video.duration;
    const totalFrames =
        Math.floor(duration * fps);

    await seekVideo(0);

    for(let i = 0; i < totalFrames; i++){

        const t = i / fps;

        await seekVideo(t);

        renderASCII();

        const frame =
            new VideoFrame(canvas, {
                timestamp:
                    Math.round(t * 1_000_000),
                duration:
                    Math.round(1_000_000 / fps),
            });

        encoder.encode(
            frame,
            { keyFrame: i % 60 === 0 }
        );

        frame.close();

        while(encoder.encodeQueueSize > 8){
            await new Promise(r =>
                setTimeout(r, 0)
            );
        }

        if(i % 5 === 0){
            statusText.innerText =
                'encoding ' +
                Math.round(
                    (i / totalFrames) * 100
                ) +
                '%';
        }
    }

    statusText.innerText = 'finalizing...';

    await encoder.flush();
    muxer.finalize();

    const blob =
        new Blob(
            [muxer.target.buffer],
            { type: 'video/mp4' }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement('a');

    a.href = url;
    a.download = 'ascii-video.mp4';
    a.click();

    URL.revokeObjectURL(url);

    statusText.innerText = 'done';

    video.play();
    render();
};

</script>

</body>
</html>
